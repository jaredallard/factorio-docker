# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: factorio-docker
report_sizes: true
metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
builds:
  - main: ./cmd/downloader
    id: downloader
    binary: downloader
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      ## <<Stencil::Block(downloaderLdflags)>>

      ## <</Stencil::Block>>
    env:
      - CGO_ENABLED=0
    goarch:
      - amd64
      - arm64
    goos:
      - linux
      - darwin
      - windows
    mod_timestamp: "{{ .CommitTimestamp }}"
  - main: ./cmd/wrapper
    id: wrapper
    binary: wrapper
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      ## <<Stencil::Block(wrapperLdflags)>>

      ## <</Stencil::Block>>
    env:
      - CGO_ENABLED=0
    goarch:
      - amd64
      - arm64
    goos:
      - linux
      - darwin
      - windows
    mod_timestamp: "{{ .CommitTimestamp }}"
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ .Commit }}"
changelog:
  use: git
release:
  gitea:
    owner: jaredallard
    name: factorio-docker
  prerelease: "auto"
  footer: |-
    **Full Changelog**: https://git.rgst.io/jaredallard/factorio-docker/compare/{{ .PreviousTag }}...{{ .Tag }}
gitea_urls:
  api: https://git.rgst.io/api/v1
  download: https://git.rgst.io

## <<Stencil::Block(extraReleaseOpts)>>

## <</Stencil::Block>>
